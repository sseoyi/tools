<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-app-region: drag; /* lets you drag the popup around */
  }
  #wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  #time { font-weight: 800; white-space: nowrap; text-shadow: 0 2px 10px rgba(255,255,255,0.9); }
  #frame { animation: wiggle 2.5s ease-in-out infinite; flex-shrink: 0; }
  #gif { display: block; }
  @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  .rainbowText {
    background: linear-gradient(90deg,#ff5252,#ffb74d,#fff176,#66bb6a,#4fc3f7,#7e57c2,#ff5252);
    background-size: 400% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent !important;
    animation: rainbowMove 3s linear infinite;
  }
  @keyframes rainbowMove { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="time">--:--:--</div>
  <div id="frame"><img id="gif"></div>
</div>
<script>
let tickTimer = null;

function computeDisplaySize(natW, natH, scale, maxW, maxH) {
  let w = natW * scale, h = natH * scale;
  const ratio = Math.min(1, maxW / w, maxH / h);
  return { w: Math.round(w * ratio), h: Math.round(h * ratio) };
}

window.electronAPI.onPopupData((data) => {
  document.documentElement.style.background = data.bgTransparent ? 'transparent' : data.bgColor;
  document.body.style.background = data.bgTransparent ? 'transparent' : data.bgColor;

  const timeEl = document.getElementById('time');
  timeEl.className = data.rainbow ? 'rainbowText' : '';
  timeEl.style.color = data.rainbow ? '' : data.timeColor;

  const img = document.getElementById('gif');
  const probe = new Image();
  probe.onload = function () {
    const screenMaxW = window.screen.availWidth * 0.45;
    const screenMaxH = window.screen.availHeight * 0.45;
    const size = computeDisplaySize(probe.naturalWidth, probe.naturalHeight, data.scale || 1.0, screenMaxW, screenMaxH);
    img.src = data.gifSrc;
    img.width = size.w;
    img.height = size.h;
    timeEl.style.fontSize = Math.max(24, Math.min(64, size.h * 0.22)) + 'px';

    const totalW = size.w + 160; // room for time text + gaps/padding
    const totalH = size.h + 40;
    window.electronAPI.resizePopup({ width: totalW, height: totalH });
  };
  probe.src = data.gifSrc;

  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const n = new Date();
    timeEl.textContent =
      String(n.getHours()).padStart(2, '0') + ':' +
      String(n.getMinutes()).padStart(2, '0') + ':' +
      String(n.getSeconds()).padStart(2, '0');
  }, 1000);
});
</script>
</body>
</html>
